<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Doc Intel | RAG System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f9; height: 100vh; display: flex; flex-direction: column; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 15px; border-radius: 15px; position: relative; }
        .user-msg { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 2px; }
        .bot-msg { align-self: flex-start; background-color: #e9ecef; color: #333; border-bottom-left-radius: 2px; }
        .source-box { font-size: 0.8rem; margin-top: 10px; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 5px; }
        .input-area { background: white; padding: 20px; border-top: 1px solid #ddd; }
        #loading { display: none; text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">🧠 Private Doc Intel</span>
        <div class="d-flex gap-2">
            <input type="file" id="pdfUpload" class="form-control form-control-sm" multiple accept=".pdf">
            <button onclick="uploadFiles()" class="btn btn-outline-light btn-sm">Subir & Procesar</button>
        </div>
    </nav>

    <div id="chat-box" class="chat-container">
        <div class="message bot-msg">
            ¡Hola! Sube tus documentos PDF arriba y luego pregúntame lo que quieras sobre ellos.
        </div>
    </div>
    
    <div id="loading">Pensando y buscando citas...</div>

    <div class="input-area container-fluid">
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Escribe tu pregunta..." onkeypress="handleEnter(event)">
            <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Historial local para enviar al backend
        let chatHistory = [];

        async function uploadFiles() {
            const input = document.getElementById('pdfUpload');
            if (input.files.length === 0) return alert("Selecciona archivos primero.");

            const formData = new FormData();
            for (const file of input.files) {
                formData.append('files', file);
            }

            const btn = document.querySelector('button[onclick="uploadFiles()"]');
            btn.innerHTML = "⏳ Procesando...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                alert(data.message);
            } catch (e) {
                alert("Error al subir: " + e);
            } finally {
                btn.innerHTML = "Subir & Procesar";
                btn.disabled = false;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // 1. Mostrar mensaje usuario
            appendMessage(text, 'user');
            input.value = '';
            document.getElementById('loading').style.display = 'block';

            try {
                // 2. Enviar a API
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                // 3. Mostrar respuesta
                appendMessage(data.answer, 'bot', data.sources);

                // 4. Actualizar historial
                chatHistory.push({ user: text, bot: data.answer });

            } catch (e) {
                appendMessage("Error: " + e.message, 'bot');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function appendMessage(text, role, sources = []) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}-msg`;
            
            // Convertir saltos de línea a <br> (básico)
            let htmlContent = text.replace(/\n/g, '<br>');

            // Agregar fuentes si existen
            if (sources && sources.length > 0) {
                htmlContent += '<div class="source-box"><strong>📚 Fuentes:</strong><br>';
                sources.forEach(s => {
                    htmlContent += `• ${s.source.split('/').pop()} (Pág ${s.page})<br>`;
                });
                htmlContent += '</div>';
            }

            div.innerHTML = htmlContent;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
